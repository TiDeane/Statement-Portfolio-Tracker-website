name: deploy

# Only main is built: other branches and pull requests are not.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Once a week, rebuild if the app has a newer release than the one the live site was built with. Visitors rarely need it: the pages ask
  # GitHub for the newest release when they load. To pick up a release at once, run this workflow by hand.
  schedule:
    - cron: '17 6 * * 1' # Mondays at 06:17 UTC

permissions:
  contents: read

jobs:
  # Whether to build: always for a push or a manual run; on the weekly schedule, only if GitHub's newest app
  # release is not the one in the live site's /release.txt (or either can't be read).
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/TiDeane/Statement-Portfolio-Tracker/releases/latest | jq -r '.tag_name // empty') || newest=""
          live=$(curl -fsSL https://statements.tiagodeane.com/release.txt | tr -d '[:space:]') || live=""
          echo "Newest release: ${newest:-unknown}. Live site built with: ${live:-unknown}."
          if [ -n "$newest" ] && [ "${newest#v}" = "$live" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # Check, test and build, then keep the build for the deploy job. A manual run started on another
  # branch does nothing.
  build:
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # Only with the build that was just checked.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed for OIDC
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        env:
          B: s3://${{ vars.S3_BUCKET }}
          CC_LONG: public,max-age=31536000,immutable
        run: |
          # Hashed files first, so new pages never point to files that aren't uploaded yet.
          aws s3 sync dist/_astro "$B/_astro" --cache-control "$CC_LONG"
          # Then the pages and the rest, which browsers revalidate every time.
          aws s3 sync dist "$B" --delete --exclude "_astro/*" --cache-control "no-cache"

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
